name: Build Skyrim SKSE Plugin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      # x64-windows, not x64-windows-static: the plugin uses the dynamic CRT (/MD), which is
      # what SKSE plugins and the game use, and it is the only CRT that lets CommonLibSSE-NG's
      # prebuilt bundle link (the bundle is /MD; on a static-CRT triplet the CMake side falls
      # back to a ~16 minute source build).
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT")) {
            throw "vcpkg not found at $env:VCPKG_ROOT"
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg.exe not found at $env:VCPKG_ROOT\vcpkg.exe"
          }

      - name: Cache vcpkg and Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/build/_deps
          key: ${{ runner.os }}-vcpkg-dynamic-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-dynamic-

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          # VCPKG_INSTALLED_DIR points at what the step above produced: in manifest mode the
          # toolchain would otherwise look in build/vcpkg_installed and reinstall everything.
          # $env:GITHUB_WORKSPACE is used rather than a workflow expression so the script
          # parses as valid PowerShell on its own; both resolve to the same directory.
          # COMMONLIB_PREBUILT_MULTICONFIG lets CommonLibSSE-NG use its published prebuilt
          # bundle under this multi-config generator; without it the bundle is skipped and the
          # ~16 minute source build runs instead.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE\vcpkg_installed" `
            -DCOMMONLIB_PREBUILT_MULTICONFIG=ON `
            -DENABLE_TESTS=ON `
            -DBUILD_TESTING=ON

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unit Tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MMOHotbar-Plugin
          path: |
            build/Release/MMOHotbar.dll
            build/Release/MMOHotbar.pdb
          if-no-files-found: error
          compression-level: 6
