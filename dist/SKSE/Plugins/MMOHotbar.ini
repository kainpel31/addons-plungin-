; MMO Hotbar - default configuration.
;
; This file only carries startup defaults and diagnostics. Everything the player
; changes in the in-game menu (hotbar position, slot size, spacing, active slot
; count and the slot placements themselves) lives in the co-save, so it travels
; with the save game. Copy this file to
;   <Skyrim>/Data/SKSE/Plugins/MMOHotbar.ini
; and edit it if you want different starting values for a fresh save.

[General]
; Log verbosity written to Documents/My Games/Skyrim Special Edition/SKSE/MMOHotbar.log
; trace | debug | info | warn | err | critical | off
sLogLevel = info

; Shift the whole hotbar when the in-game menu is opened? The hotbar is always
; hidden while a menu is open, this only controls whether it also animates out.
bAnimateOnMenuOpen = true

[Hotbar]
; Number of slots drawn on screen. The in-game menu can change this at any time;
; this is only the value used before a save is loaded. Range 1-12.
iSlotCount = 8

; Screen position of the top-left corner of the first slot, in pixels.
fPositionX = 40.0
fPositionY = -120.0

; Slot size and gap between slots, in pixels.
fSlotSize = 48.0
fSlotSpacing = 4.0

; Draw the item name under the hotkey label inside each slot.
bShowItemName = true

; Draw the hotkey chord (e.g. "Shift+1") instead of only the last key.
bShowFullChord = false

; Badge shown on a slot bound to a group of items (STB "groups").
bShowGroupBadge = true

[Icons]
; Optional icon pack. Drop PNG/SVG files in
;   <Skyrim>/Data/SKSE/Plugins/MMOHotbar/icons/
; and map them to forms in icons.json. Nothing is shipped with the mod, so slots
; fall back to the item name when a form has no icon.
bEnableIcons = false

[Compatibility]
; Refuse to draw the hotbar while a blocking game menu (inventory, console, ...)
; is open. Keep this on unless another mod already does it.
bHideWhileMenuOpen = true

; Log a warning when the STB Hotkey System API cannot be found at load time.
bWarnWhenStbMissing = true
